id: write
version: 1
goal: >
  Turn one idea into one Facebook post that is ready to publish as it stands, in the owner's
  voice, with the picture it needs described.
non_goals:
  - does not decide whether this idea deserves a post; selection already did
  - does not check its own work against the rubric; a separate call does, on purpose
  - does not choose when the post goes out
  - does not produce variants, options, or "here are two angles"; one finished post
  - does not invent facts, numbers, quotes, customers, or personal stories

# --- T = (I, O, R) -------------------------------------------------------
input:
  schema: crews/content_crew/03-schemas/write_task.schema.json
  description: >
    One idea (theme, hook, angle, source, the owner's note if any), the content type selection
    chose, why it was picked today, the active lessons, the strategy and voice, and the last
    posts that went out so it does not repeat them. On a rewrite, also the issues the check
    raised.
  preconditions:
    - content_type is one of observation | story | education | offer
    - a story idea carries the owner's own words; without them, it is not a story
    - lessons are the active set, already capped

output:
  schema: crews/content_crew/03-schemas/written_post.schema.json
  description: >
    `{text, image_prompt, content_type, leads_to_offer}`. The text is the post, exactly as it
    would appear on Facebook.
  postconditions:
    - text contains no placeholders, no brackets to fill, no notes to the reader
    - the first line works as the hook, because Facebook truncates the rest
    - image_prompt describes one picture and asks for no words inside it

requirements:
  - publishable as it stands — "good enough, the owner will fix it" is not the bar
  - Vietnamese, in the owner's register, not marketing-agency Vietnamese
  - a story uses the owner's words where the idea supplied them, and invents no experience they
    did not describe
  - every post can name the offer it leads toward, even when that offer is still weeks away
  - no fabricated specifics: no invented statistics, screenshots, client names, or results
  - no words inside the generated picture; image models mangle Vietnamese text, and a mangled
    word on a brand picture is worse than no picture
  - on a rewrite, it addresses the issue the check raised instead of rephrasing around it

# --- Capability ----------------------------------------------------------
tools: []
model:
  tier: frontier
  rationale: >
    This call is the deliverable. Everything else in the crew is cheap so that this one does not
    have to be. Model chosen for writing quality, owner's pick, any provider OpenRouter carries.
memory:
  scope: none
  store: none
  rationale: stateless; everything it needs arrives on the item

# --- Control -------------------------------------------------------------
max_iterations: 1
timeout_seconds: 120
stop_conditions:
  - output validates against the schema
on_failure:
  action: fail_closed
  to: the post row stays in `writing` for inspection; no card is sent
  retries: 1

why_not_merged: >
  Not merged with `check`, because a reviewer sharing the writer's context agrees with the
  writer. The check runs as its own call with its own instructions and none of the reasoning that
  produced the text. Not merged with `chat-agent` for the reasons in that contract.

# --- Observability -------------------------------------------------------
logs:
  - token_usage
  - final_output
  - rewrite_number
eval:
  dataset: crews/content_crew/06-evals/write.jsonl
  metrics: [approved_without_edit_rate, check_pass_first_try, fabrication_rate, cost_per_post]

owner: Duc Che
